<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高科校園試玩</title>
<!-- 加到主畫面：全螢幕、圖示、離線（sw.js） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="圖示/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="高科校園">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ececec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap" rel="stylesheet">
<style>
/* 版面：第一層是上下翻頁的四頁（今天、本週、本月、學期），第二層是右下常駐課程輪盤，左下是「我」抽屜 */
/* 視覺語言：一個點是一個時間單位，線代表連續；橘色代表「現在」和輪盤上選中的那一個 */
:root{--bg:#ececec;--fg:#111113;--mute:#6c6c73;--rail:#c8c8cc;--past:#77777d;--disc:#f6f6f6;--hub:#e2e2e4;--core:#d6d6d9;--line:rgba(0,0,0,.14);--hot:#e0480f;--veil:rgba(236,236,236,.72);--gl1:rgba(255,255,255,.38);--gl2:rgba(255,255,255,.12);--glhi:rgba(255,255,255,.45);--gllo:rgba(0,0,0,.06);--glsh:rgba(0,0,0,.10);--glrim:rgba(255,255,255,.7);--dim:#a9a9ae;
--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;--dot:"Doto",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--fg:#f2f2f4;--mute:#9a9aa2;--rail:#3a3a40;--past:#7c7c84;--disc:#1f1f23;--hub:#2a2a2f;--core:#34343a;--line:rgba(255,255,255,.16);--hot:#ff6a33;--veil:rgba(20,20,22,.72);--gl1:rgba(70,70,78,.32);--gl2:rgba(30,30,34,.18);--glhi:rgba(255,255,255,.1);--gllo:rgba(0,0,0,.45);--glsh:rgba(0,0,0,.45);--glrim:rgba(255,255,255,.16);--dim:#4c4c53;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--fg:#f2f2f4;--mute:#9a9aa2;--rail:#3a3a40;--past:#7c7c84;--disc:#1f1f23;--hub:#2a2a2f;--core:#34343a;--line:rgba(255,255,255,.16);--hot:#ff6a33;--veil:rgba(20,20,22,.72);--gl1:rgba(70,70,78,.32);--gl2:rgba(30,30,34,.18);--glhi:rgba(255,255,255,.1);--gllo:rgba(0,0,0,.45);--glsh:rgba(0,0,0,.45);--glrim:rgba(255,255,255,.16);--dim:#4c4c53;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
p{margin:0}
[hidden]{display:none!important}
/* 文字分四級：1 一句話、2 名稱、3 細節、4 教學提示。標準拿掉 4，精簡再拿掉 3；提示做過 3 次就自己消失 */
:root[data-text="std"] [data-lv="4"],:root[data-text="min"] [data-lv="3"],:root[data-text="min"] [data-lv="4"],[data-hint].learned{display:none!important}
button{font:inherit;color:inherit}
#app{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:none;scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
/* 底部留給左下「我」和右下輪盤，內容不放進兩個角 */
.page{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box;max-width:520px;margin:auto;padding-top:14px;padding-bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 46px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:22px}
/* 四頁的頁名列底下留一大段空，內容不要貼著頁名列 */
/* 四頁的頂欄一樣高，內容從同一條線開始往下排 */
.page{--lead:22px}
.page>.top{margin-bottom:32px;min-height:44px}
.mono{font:11px/1.3 var(--mono);letter-spacing:.04em;color:var(--mute);font-variant-numeric:tabular-nums}
/* 頂部頁名列：四頁長得一樣，只有目前那頁變深 */
.idx{display:flex;gap:14px}
.idx button{border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;color:var(--mute)}
.idx button.on{color:var(--fg);font-weight:700}
.pin{border:0;background:none;padding:2px 0;cursor:pointer;font:11px/1.3 var(--mono);color:var(--mute)}
.pin.on{color:var(--fg)}
/* 日期和更新時間放在頁名列右邊，標題下面不再多一行 */
.when{margin-left:auto;text-align:right;line-height:1.35}
/* 頁名列只有一份，固定在最上面，翻頁時不動；右邊的日期換成目前那頁的，淡出淡入 */
#bar{position:fixed;top:0;left:0;right:0;margin:auto;max-width:520px;z-index:2;box-sizing:border-box;background:var(--bg);padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bar.top{min-height:58px}
#whens{margin-left:auto;display:grid;justify-items:end}
#whens>.when{grid-area:1/1;align-self:center;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#whens>.when.on{opacity:1;visibility:visible;transition:opacity .2s}
.sub{margin-top:6px}
h1{font-size:22px;font-weight:600;line-height:1.25;margin:4px 0 0;text-wrap:balance}
.sec{margin-top:10px}
.lowr{padding-right:72px}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.rows{display:grid;gap:4px;font-size:13px}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows span:last-child{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.rows .lnk{cursor:pointer}
.val{font-size:30px;font-weight:300;line-height:1.2;margin:10px 0 6px}
.t{font-size:15px;font-weight:600;line-height:1.25}
.s{font-size:12px;line-height:1.35;color:var(--mute)}
.lbl{font:11px var(--mono);letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
.live{color:var(--hot)}
.add{border:1px solid var(--line);background:none;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}

/* 點和圖示：● 學校排好的、○ 要你去做的、■ 考試；沒事的節次或日子是淡的小點 */
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--fg)}
.dot.e{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--rail)}
/* 上完的點用不透明的淡色，疊在連線上才不會透出兩層 */
.dot.done{background:color-mix(in srgb,var(--past) 45%,var(--bg))}
.dot.now{background:var(--hot);opacity:1}
.dot.e.now{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
/* 連堂：同一門課相鄰的點用線連起來 */
.link{position:absolute;width:4px;margin-left:-2px;border-radius:2px;background:var(--fg)}
.link.done{background:var(--past);opacity:.55}
.ic{position:absolute;box-sizing:border-box;transition:transform .15s}
.ic.hw{width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid var(--fg);border-radius:50%;background:var(--bg)}
.ic.hw.over{width:20px;height:20px;margin:-10px 0 0 -10px;background:none}
.ic.ex{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--fg);border-radius:1px}
.ic.done{opacity:.4}
.ic.hl{transform:scale(1.7)}
/* 清單裡的同一套圖示 */
.md{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--fg);box-sizing:border-box}
.md.e{width:4px;height:4px;background:var(--rail)}
.md.hw{border:2px solid var(--fg);background:none}
.md.ex{border-radius:1px}
.ann{display:inline-block;min-width:16px;height:16px;margin-left:6px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--fg);color:var(--bg);font:600 10px/16px var(--mono);text-align:center;vertical-align:2px}

/* 今天：一排節次點，每節固定間距，不照實際時間拉長 */
#railbox{--x:50px;position:relative;flex:1;min-height:0;margin-top:calc(var(--lead) - 8px);display:flex;flex-direction:column}
#dots{position:relative;flex:none}
#dots .dot,#dots .link,#dots .ic{left:var(--x)}
/* 中午：A 節的位置放一個短橫，示意是中午 */
#dots .noon{left:var(--x);width:14px;margin-left:-7px;border-top:2px solid var(--mute)}
/* 節次欄、節次列的中午短橫（不要叫 nd，清單已經用 nd 表示換一天） */
.noondash{display:inline-block;width:10px;height:0;border-top:2px solid var(--mute);vertical-align:middle}
/* 點分兩級：小是空堂，大是有課（上完的一樣大、顏色變淡）；正在上的那堂畫成一條線，橘色滑塊滑到現在這節 */
#dots{--mid:6px}
#dots .dot.e{width:4px;height:4px;margin:-2px 0 0 -2px}
#dots .dot.done{width:12px;height:12px;margin:-6px 0 0 -6px}
#dots .link{width:var(--mid);margin-left:calc(var(--mid)/-2);border-radius:calc(var(--mid)/2)}
#knob{position:absolute;left:var(--x);top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--hot);pointer-events:none;
  transition:top .4s cubic-bezier(.3,.8,.25,1),width .2s,height .2s,margin .2s}
#knob.gap{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
#grab{position:absolute;left:calc(var(--x) - 26px);top:0;bottom:0;width:44px;touch-action:none;cursor:ns-resize;z-index:3}
.tick{position:absolute;right:calc(100% - var(--x) + 14px);transform:translateY(-50%);font:11px/1 var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.hot{color:var(--hot)}
.lab{position:absolute;left:calc(var(--x) + 22px);right:0;cursor:pointer}
.lab.done .t{font-weight:400;color:var(--past)}
#refresh{border:0;background:none;cursor:pointer;padding:0;font:inherit;color:inherit}
/* 日頁跟著週課表樣式（「我 → 設定 → 週課表樣式」）：直條、格子、橫條是一門課一塊；點線就是原本的點 */
#railbox .db{position:absolute;box-sizing:border-box;cursor:pointer;background:var(--hub);color:var(--fg);transition:background .2s}
#railbox .db.done{color:var(--past);background:color-mix(in srgb,var(--hub) 55%,var(--bg))}
#railbox .db.cur{background:var(--hot);color:#fff}
#railbox .db.ex{background:var(--fg);color:var(--bg)}
#railbox .db b{display:block;font-size:15px;font-weight:600;line-height:1.25}
#railbox .db small{display:block;font-size:11px;line-height:1.3;opacity:.75;margin-top:2px}
#railbox .db .ic.bdg{position:absolute;inset:auto 8px 13px auto;translate:0 50%;transform:none}
#railbox:not([data-s="c"]) #knob{box-shadow:0 0 0 2px var(--bg)}
[data-s="d"] #dots .noon{display:none}
/* 直條：一根圓角直條，課名和教室寫在右邊 */
[data-s="a"] .db{left:var(--x);width:22px;margin-left:-11px;border-radius:11px}
[data-s="a"] .db .ic.bdg{inset:auto auto 11px 50%;translate:-50% 50%}
[data-s="d"] .db .ic.bdg{inset:50% 8px auto auto;translate:0 -50%}
/* 格子（日頁）：一條直線在底下，節與節之間一小段刻度，中午刻度長一點；一門課一個正方形，中心壓在線上把線蓋住，課名、教室在左上 */
#railbox[data-s="b"]{--x:104px}
[data-s="b"] .tick{right:calc(100% - var(--x) + 50px)}
[data-s="b"] .db{left:var(--x);border-radius:6px;padding:6px 7px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
[data-s="b"] .db b{font-size:13px;line-height:1.2}
[data-s="b"] .db small{font-size:10px}
/* 上課中方塊本身就是橘色，橘點躲到方塊底下，不蓋住教室字；下課時間橘點照常露在線上 */
[data-s="b"] #knob{z-index:0}
[data-s="b"] .db{z-index:1}
[data-s="b"] .bax{position:absolute;left:var(--x);top:0;bottom:0;width:0;border-left:1.5px solid var(--rail);margin-left:-.75px;pointer-events:none}
[data-s="b"] .btk{position:absolute;left:var(--x);width:8px;margin-left:-4px;height:0;border-top:1.5px solid var(--rail);pointer-events:none}
[data-s="b"] .btk.long{width:26px;margin-left:-13px;border-top-color:var(--mute)}
/* 橫條：今天一行，左到右是節次，和週頁的橫條同一排法 */
[data-s="d"] #dots{margin:22px 0 26px}
[data-s="d"] .dgrid{position:absolute;inset:0;border-block:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
[data-s="d"] .db{top:8px;bottom:8px;border-radius:10px;padding:0 9px;display:flex;flex-direction:column;justify-content:center;white-space:nowrap;overflow:hidden}
[data-s="d"] .db b{font-size:14px}
[data-s="d"] .dper{position:absolute;bottom:100%;margin-bottom:7px;transform:translateX(-50%);font:10px/1 var(--mono);color:var(--dim)}
[data-s="d"] .tick{right:auto;top:calc(100% + 8px)!important;transform:translateX(-50%)}
/* 橫條的現在點壓在上面那條格線上，不蓋到課名 */
[data-s="d"] #knob{transition:left .4s cubic-bezier(.3,.8,.25,1),width .2s,height .2s,margin .2s}
[data-s="d"] #grab{left:0;right:0;width:auto;cursor:ew-resize}
[data-s="d"] #dots .ic:not(.bdg){top:50%}
/* 今日待辦：時間軸下面另一區，左邊日常、右邊課業 */
#todo{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
#todo .it{display:flex;align-items:flex-start;gap:8px}
#todo .it .md{margin-top:4px}
#todo .it>div{flex:1;min-width:0}
#todo .none{padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--past)}

/* 本週：每天一排節次點，合起來是點陣課表；右邊分考試、作業 */
/* 上面是點陣課表；下面兩欄，左邊 HW、右邊 TEST，和今天頁的待辦一樣 */
#wk{flex:1;min-height:0;margin-top:var(--lead);display:flex;flex-direction:column;gap:36px}
#wbot{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
/* 本週清單平常只寫名稱；點一項才展開截止時間 */
#wbot .it .s{display:none}
#wbot .it.hl .s{display:block}
/* 同一天的項目之間不畫線，換一天才畫 */
#wbot .it{border-top:0}
#wbot .it.nd{border-top:1px solid var(--line)}
/* 亮暗和上面的課表同一套：今天白、今天做完的介於白和灰之間、其他天灰；粗細不變 */
#wbot .it b{color:var(--mute);font-weight:600}
#wbot .it.td b,#wbot .it.td .wk{color:var(--fg)}
#wbot .it.td.done b,#wbot .it.td.done .wk{color:color-mix(in srgb,var(--fg) 55%,var(--mute))}
/* 中午線：畫在 A 節的位置，分開上午和下午；A 節沒課就不畫點 */
.noon{position:absolute;left:-2px;width:42px;height:0;border-top:1px solid var(--mute)}
/* 本週課表：四種樣式（直條、格子、點線、橫條），在「我」的設定裡選，存在手機裡 */
/* 一門課連著上的幾節是一塊；考試蓋住那一整塊（反白），作業圈在那門課那塊的右下角，當天沒那門課就放最下面的「其他」小框 */
#wdays{display:flex;flex:none;padding-right:10px}
.wg{position:relative;flex:none;width:18px;margin-top:38px}
.wg span{position:absolute;left:0;transform:translateY(-50%);font:10px/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.wd{flex:1;min-width:0;display:flex;flex-direction:column}
.wd>b{height:38px;box-sizing:border-box;padding-left:4px;display:flex;flex-direction:column;gap:3px;font:12px/1 var(--sans);color:var(--mute)}
.wd>b small{font:10px/1 var(--mono);color:var(--dim)}
.wd.today>b{color:var(--fg);font-weight:700}
.wd.today>b small{color:var(--mute)}
#wdays[data-s="a"] .wd>b,#wdays[data-s="c"] .wd>b{align-items:center;padding-left:0}
#wdays[data-s="c"] .wd>b{align-items:flex-start;padding-left:6px}
#wdays[data-s="b"] .wd>b{padding-left:7px}
.wcol{position:relative;flex:none}
.wb{position:absolute;box-sizing:border-box;cursor:pointer;transition:opacity .2s,background .2s}
.wb.hl{outline:2px solid var(--fg);outline-offset:2px}
/* 作業圈掛在那一節的右邊 */
.wcol .ic{right:5px;margin:0;translate:0 -50%}
.wcol .ic.hw,.wcol .ic.ex{width:9px;height:9px}
.wcol .ic.hl{transform:scale(1.7)}
.wcol .ic.inb{position:static;translate:none;margin:0;flex:none}
.wg span{white-space:nowrap}
/* 作業圈：不管課是灰、橘、白，都是同一個白圈（內外各一圈深色描邊，在白色的考試塊上也看得到），中心對齊那塊的最後一節 */
.ic.bdg{width:12px!important;height:12px!important;margin:0!important;border:2px solid var(--fg)!important;background:none!important;border-radius:50%;box-shadow:0 0 0 1.5px var(--bg),inset 0 0 0 1.5px var(--bg)}
.wcol .ic.bdg{top:auto;right:6px;bottom:var(--lb);translate:0 50%;--lb:13px}
#wdays[data-s="c"] .ic.bdg{right:auto;left:34px;--lb:14px}
#wdays[data-s="d"] .wcol .ic.bdg{top:50%;bottom:auto;right:7px;left:auto;translate:0 -50%}
#wdays[data-s="a"] .ic.bdg{right:auto;left:50%;translate:-50% 50%;--lb:11px}
/* 格子：作業改成一個細細的小圈，顏色跟塊裡的字一樣；離右邊和下邊一樣遠，從角落往內縮 */
#wdays[data-s="b"] .wcol .ic.bdg{width:7px!important;height:7px!important;border:1.2px solid currentColor!important;box-shadow:none;top:auto;right:8px;bottom:8px;translate:none;opacity:.9}
#wdays[data-s="b"] .wcol .ic.bdg.done{opacity:.45}
/* 直條有作業圈時，課名靠上排，留出最後一節給圈 */
#wdays[data-s="a"] .wb.has{align-items:flex-start;padding-top:5px}
#wdays[data-s="a"] .wb.has span{letter-spacing:0}
.wb{overflow:visible!important}
/* 點清單的一項：同一門課留著，其他課淡掉 */
#wdays.fx [data-cn]:not(.lk){opacity:.25}
@keyframes wfade{from{opacity:0;translate:0 6px}}
#wk.in .wb,#wk.in .wcol .ic,#wk.in .wdot{animation:wfade .35s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d)*45ms + var(--r)*20ms)}
@media (prefers-reduced-motion:reduce){#wk.in *{animation:none!important}}

/* 共用的三種狀態：平常淺灰底、上完的字變淡、正在上的橘色；考試整塊反白 */
.wb{background:var(--hub);color:var(--mute)}
.wd.today .wb{color:var(--fg)}
.wb.done{color:var(--past);background:color-mix(in srgb,var(--hub) 55%,var(--bg))}
.wb.cur{background:var(--hot);color:#fff}
.wb.ex{background:var(--fg);color:var(--bg)}
.wb small{display:block;font:10px/1.2 var(--sans);font-weight:400;opacity:.75}

/* A 直條：一門課一根圓角直條，課名由上往下寫在條裡 */
#wdays[data-s="a"] .wb{left:50%;width:28px;margin-left:-14px;border-radius:14px;display:flex;align-items:center;justify-content:center}
#wdays[data-s="a"] .wb span{writing-mode:vertical-rl;text-orientation:upright;font:600 12px/1 var(--sans);letter-spacing:2px}

/* B 格子：最一般的課表，每節一條細格線，課是圓角方塊，名字橫寫、底下教室 */
#wdays[data-s="b"] .wcol{background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 28px);border-left:1px solid var(--line)}
#wdays[data-s="b"] .wd:last-child .wcol{border-right:1px solid var(--line)}
#wdays[data-s="b"] .wb{left:2px;right:2px;border-radius:7px;padding:5px;font:600 12px/1.2 var(--sans)}
#wdays[data-s="b"] .wb small{margin-top:2px;word-break:keep-all}
#wdays[data-s="b"] .wcol .ic{right:3px}

/* C 點線：一節一個點，同一門課的點用實線串起來，課名由上往下寫在旁邊；考試的點換成方塊 */
#wdays[data-s="c"] .wb{left:4px;width:12px;background:none}
#wdays[data-s="c"] .wb::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:4px;border-radius:2px;background:currentColor}
#wdays[data-s="c"] .wb i:not(.ic){position:absolute;left:1px;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:currentColor}
#wdays[data-s="c"] .wb.ex i:not(.ic){border-radius:1px}
#wdays[data-s="c"] .wb.ex,#wdays[data-s="c"] .wb.done{background:none}
#wdays[data-s="c"] .wb.ex{color:var(--fg)}
#wdays[data-s="c"] .wb.cur{color:var(--hot)}
#wdays[data-s="c"] .wb span{position:absolute;left:18px;top:6px;writing-mode:vertical-rl;text-orientation:upright;font:600 12px/1 var(--sans);letter-spacing:3px;white-space:nowrap}
#wdays[data-s="c"] .wdot{position:absolute;left:9px;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--rail)}

/* D 橫條：一天一行，左到右是節次，課是一段橫條，名字橫寫 */
#wdays[data-s="d"]{display:block}
.dh{display:flex;margin-left:28px;height:22px}
.dh span{flex:1;text-align:center;font:10px/1 var(--mono);color:var(--dim)}
.dr{display:flex;align-items:stretch;height:52px;border-top:1px solid var(--line)}
.dr>b{width:28px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px;font:12px/1 var(--sans);color:var(--mute)}
.dr>b small{font:10px/1 var(--mono);color:var(--dim)}
.dr.today>b{color:var(--fg);font-weight:700}
.dr .wcol{flex:1;height:auto}
#wdays[data-s="d"] .wb{top:7px;bottom:7px;border-radius:9px;display:flex;flex-direction:column;justify-content:center;padding:0 7px;font:600 12px/1.2 var(--sans);white-space:nowrap;overflow:hidden}
#wdays[data-s="d"] .dr.today .wb:not(.done):not(.ex):not(.cur){color:var(--fg)}
#wdays[data-s="d"] .wcol .ic{right:auto;top:50%;translate:-50% -50%}
#wtask{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
/* 作業從中午線的高度開始往下排 */
.blk .mono{margin-bottom:4px}
/* 本週清單的標題：前面放和點陣上同一個圖示（灰色），字用英文 TEST、HW */
.bh{display:flex;align-items:center;gap:6px;--fg:var(--mute)}
.bh .md{width:8px;height:8px}
.it{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:7px 0;cursor:pointer}
.it b{display:block;font-size:15px;font-weight:600;line-height:1.25}
/* 清單項目的名稱和下面那行時間拉開一點，日、週兩頁一起用 */
.it b+.s{margin-top:4px}
.it .wk{font:11px var(--mono);color:var(--mute);margin-right:6px;font-weight:400}
.it.hl{border-top-color:var(--fg)}
.it.hl .wk{color:var(--fg)}
/* 本週清單的星期用英文縮寫；今天那天白色，其他天淡色 */
.it.td .wk{color:var(--fg)}
.it.done b{font-weight:400;color:var(--past)}

/* 本月：一個點是一天，從這週那一列起排四週，日期數字是細節；這週那一列淡底 */
#msum{font-size:17px}
/* 日子點陣：格子固定 40×40，左右、上下等距，靠左排 */
#cal{display:grid;grid-template-columns:repeat(7,40px);margin-top:var(--lead)}
#cal .h{font-size:11px;color:var(--mute);text-align:center;padding-bottom:4px}
#cal button{border:0;background:none;cursor:pointer;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font:11px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
/* 兩階：這週用前景色，之後三週灰 */
#cal button:not(.wk){--fg:var(--mute)}
#cal button.wk span{color:var(--fg)}
#cal .md.e{margin:3px 0}
#cal .past .md{opacity:.35}
#cal .today .md{width:10px;height:10px;background:var(--hot);border-color:var(--hot)}
#cal .today span{color:var(--hot)}
#cal .sel .md{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--fg)}
#mlist{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:20px}
/* 接下來：四週各一塊，左上第 1 週、右上第 2 週、左下第 3 週、右下第 4 週 */
/* 四塊平分下面的空間，上下兩列各佔一半 */
#evs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:28px 20px;margin-top:14px;flex:1;min-height:0;overflow:auto;scrollbar-width:none}
#evs.one{grid-template-columns:1fr;grid-template-rows:auto}
.mwk{display:grid;grid-template-columns:20px 1fr;align-content:start;column-gap:8px;min-width:0}
.mwk .d{grid-column:1;font:11px/22px var(--mono);color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.mev{grid-column:2;display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;line-height:22px;padding-left:8px;border-left:1px solid var(--line)}
.mev>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mev.gone{color:var(--past)}
.mev[data-c]{cursor:pointer}
#addf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#addf input{font:14px var(--sans);color:var(--fg);background:var(--disc);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
#addf #at{flex:1 1 140px}
#addf #ad{flex:0 1 150px}

/* 學期：由舊到新、左到右；圓環的分類就是成績的分組 */
#semv{flex:1;min-height:0;touch-action:pan-y;margin-top:var(--lead);overflow:hidden}
.semc{display:flex;flex-direction:column;gap:24px;min-width:0}
/* 本學期 18 週點：四頁共用，點的中心壓在螢幕左邊緣，只露出右半邊；由上往下，翻頁時不動 */
/* 18 週點改放螢幕最右邊，一樣只露半邊；下面讓出學期頁小輪盤（輪盤尺寸的一半）的高度，不和輪盤重疊 */
#weeks{position:fixed;right:0;top:76px;bottom:calc(min(80vw,44dvh,380px)*.5 + 16px);width:0;align-items:center;z-index:1;pointer-events:none}
.wkd{display:flex;flex-direction:column;justify-content:space-between;align-items:center;align-self:stretch;width:12px}
.wkd i{width:6px;height:6px;border-radius:50%;background:var(--rail)}
.wkd i.done{background:var(--past)}
.wkd i.ex{width:8px;height:8px;border-radius:1px;background:var(--fg)}
.wkd i.now{width:10px;height:10px;background:var(--hot)}
/* 大圓環和學期名稱整塊往右一點，不貼左邊的週點；底下小圓環不跟著移 */
.credit{display:flex;gap:18px;align-items:center;margin-left:16px}
/* 大圓環和下面第一組成績拉開，和組與組之間一樣是 36px 以上 */
.credit+.grp{margin-top:20px}
.credit h1{margin:0 0 4px}
.credit .s+.s{margin-top:2px}
/* viewBox 裁到圓環外緣；小圓環置中在大圓環底下，成績清單和學期名稱從同一條線開始 */
.ring{flex:0 0 auto;width:118px;height:118px}
.ring text{fill:var(--fg)}
/* 三組之間拉開，組名用前景色，一眼分得出是哪一組 */
.grp .lbl{display:flex;justify-content:space-between;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--fg);font-weight:600}
.cg{display:grid;grid-template-columns:118px 1fr;column-gap:18px;align-items:start;justify-items:center}
.cg>div{justify-self:stretch;min-width:0}
.cg+.cg{margin-top:36px}
.sring{width:40px;height:40px}
.sring text{fill:var(--fg)}

/* 常駐輪盤與內容面板 */
#stage{position:fixed;inset:0;margin:auto;max-width:520px;pointer-events:none;z-index:5}
#sheet{position:absolute;inset:0;background:var(--bg);pointer-events:auto;display:flex;flex-direction:column;box-sizing:border-box;padding-top:14px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#close{border:0;background:none;cursor:pointer;font-size:13px;color:var(--mute);padding:4px 0 4px 12px}
#dt{flex:1;min-height:0;overflow:auto;cursor:pointer;padding-bottom:12px}
#dt.full{cursor:default}
/* 課程頁：課名最大，下一件事是唯一放大的一行，之後的事照時間往下 */
/* 頂欄和四頁一樣高、底下留一樣的空；上課時間和教室放頂欄右邊，位置和四頁的日期一樣 */
#sheet{--lead:22px}
#sheet>.top{min-height:44px;margin-bottom:32px}
#close{margin-left:12px}
.next{display:flex;align-items:center;gap:10px;margin:var(--lead) 0 12px;font-size:19px;line-height:1.3}
.cmore{margin-top:36px}
.next .md{width:12px;height:12px}
.next .mono{margin-left:auto;font-size:12px}
.cev{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.cev .w{font:11px var(--mono);color:var(--mute)}
/* 作業截止大多是 23:59，清單裡只寫日期；右下輪盤這時縮在角落，清單不用讓出右邊 */
/* 完整課程頁照年頁排：上面左邊是這門課在一週裡的點陣、右邊課名和上課時間教室學分；下面考試、作業各一組，小圓環在左、清單在右 */
.chead{display:flex;gap:18px;align-items:center}
.chead h1{margin:0 0 4px}
.chead .s{font-size:13px}
/* 老師用前景色，上課時間、教室、學分用淡色 */
.chead .s.tc{color:var(--fg)}
.cmap{flex:0 0 auto;width:118px;height:118px}
.chead+.next{margin-top:28px}
.cbody .grp{margin-top:36px}
.cbody .rows .gone span{color:var(--past)}
.cbody .rows span{white-space:nowrap}
.cbody .rows span:first-child{overflow:hidden;text-overflow:ellipsis}
.cbody .rows .nx span:first-child{font-weight:600}
/* 評價三段，接在資料清單下面；選中用前景色，不用橘色 */
.crate{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.crate .seg3 button{padding:3px 9px}
.chead .s.tc b{font-weight:700}
/* 評價「神」用橘色：使用者指定的例外，其他評價照一般前景色 */
.chead .s.tc b.god{color:var(--hot)}
.crate .seg3 button.on.god{background:var(--hot);color:#fff}
#stage{--dz:min(80vw,44dvh,380px)}
#dial,#glass{position:absolute;right:0;bottom:0;width:var(--dz);height:var(--dz);transform-origin:100% 100%;transition:transform .42s cubic-bezier(.22,1.18,.36,1)}
#dial{touch-action:none;cursor:pointer;display:block;outline:none;pointer-events:auto}
/* 打開是柔和的彈簧，收起是不回彈的快速減速 */
#dial.mid,#glass.mid{transform:scale(.8)}
/* 學期頁平常是小尺寸，學期名字一直看得到；按住才放大到中尺寸 */
#dial.sm,#glass.sm{transform:scale(.5)}
#dial.sm .hub{opacity:0}
/* 圓心的返回符號跟右下角圖示同一個箭頭；課程討論的半張分類輪盤平常就露出來，點它回首頁 */
#dial .hgi{fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dial.sm.disc .hub{opacity:.85}
#dial.sm.disc .hgi{transform:scale(1.5) translate(-12px,-12.5px)}
#dial.mini,#glass.mini{transform:scale(.25);transition-duration:.26s;transition-timing-function:cubic-bezier(.4,0,.2,1)}
/* 三種輪盤樣式：glass 液態玻璃底、dot 無底點陣、mix 玻璃底加點陣標記；在「我」裡切換 */
/* 液態玻璃底：不畫框線，靠內陰影做厚度（左上弧線受光、右下微暗），左上弧線內側一段柔光（不畫線，免得放大後變粗、邊緣變硬），中段一團淡光，看起來像水滴鼓起來；Chrome 系另外加 .lens，把背景在弧線邊緣往內折 */
:root{--pf:rgba(255,255,255,.05);--pfhi:rgba(255,255,255,.7);--pflo:rgba(0,0,0,.10);--pfsh:rgba(0,0,0,.14);--pfspec:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pf:rgba(40,40,46,.18);--pfhi:rgba(255,255,255,.16);--pflo:rgba(0,0,0,.35);--pfsh:rgba(0,0,0,.5);--pfspec:rgba(255,255,255,.2)}}
:root[data-theme="dark"]{--pf:rgba(40,40,46,.18);--pfhi:rgba(255,255,255,.16);--pflo:rgba(0,0,0,.35);--pfsh:rgba(0,0,0,.5);--pfspec:rgba(255,255,255,.2)}
#glass{pointer-events:none;border-top-left-radius:100%}
#glass,#home{background:var(--pf);-webkit-backdrop-filter:blur(8px) saturate(190%);backdrop-filter:blur(8px) saturate(190%);
  box-shadow:inset 10px 12px 22px -14px var(--pfhi),inset -14px -16px 30px -18px var(--pflo),0 10px 36px -6px var(--pfsh),0 2px 6px -2px var(--pfsh)}
#glass::before,#home::before{content:"";position:absolute;inset:0;border-top-left-radius:100%;pointer-events:none;background:radial-gradient(circle farthest-side at 100% 100%,transparent 0 calc(100% - 16px),var(--pfspec) calc(100% - 3px),transparent 100%);-webkit-mask:conic-gradient(from 270deg at 100% 100%,transparent 8deg,#000 45deg,transparent 82deg);mask:conic-gradient(from 270deg at 100% 100%,transparent 8deg,#000 45deg,transparent 82deg);opacity:.7}
#glass::after{content:"";position:absolute;inset:0;border-top-left-radius:100%;pointer-events:none;background:radial-gradient(ellipse 60% 45% at 62% 48%,rgba(255,255,255,.14),transparent 70%);mix-blend-mode:screen}
#glass.lens{-webkit-backdrop-filter:url(#lensF) blur(6px) saturate(190%);backdrop-filter:url(#lensF) blur(6px) saturate(190%)}
:root[data-dial="dot"] #glass{display:none}
#dial text{fill:var(--fg);user-select:none;-webkit-user-select:none;transition:opacity .2s;paint-order:stroke;stroke:var(--bg);stroke-width:0;stroke-linejoin:round}
:root[data-dial="dot"] #dial text{stroke-width:4px}
#dial .ri{font-size:15px;transition:font-size .12s ease-out,fill .15s,opacity .15s}
#dial .rp{fill:none;stroke:var(--hot);stroke-width:1.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;pointer-events:none}
:root:not([data-dial="glass"]) #dial.sem .ri{font-family:var(--dot);font-weight:800!important}
#dial .guide{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:0 8;opacity:.22;transition:opacity .2s}
#dial .mk{fill:var(--hot)}
:root[data-dial="glass"] #dial .guide,:root[data-dial="glass"] #dial .mk{display:none}
#dial .hub{opacity:.6;transition:transform .15s ease-out,opacity .15s}
#dial .hub.on{transform:scale(1.7);opacity:1}
#dial .hg{font-size:22px;font-weight:600}
#dial.mini text{opacity:0!important}
#dial.mini .guide,#dial.mini .hub{opacity:0}
#sheet{transition:opacity .15s}
#sheet.leave{opacity:0}
#mini{position:absolute;right:0;bottom:0;width:calc(var(--dz)*.25);height:calc(var(--dz)*.25);box-sizing:border-box;border-top-left-radius:100%;isolation:isolate;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 max(10px,env(safe-area-inset-right,0px)) 10px 0;font-size:11px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;text-align:right;text-shadow:0 0 3px var(--bg)}
:root[data-dial="dot"] #mini::before{content:"";position:absolute;inset:0;z-index:-1;border-top-left-radius:100%;background:radial-gradient(circle,var(--fg) 1.1px,transparent 1.6px) 0 0/7px 7px;opacity:.38}
#dial.mini~#mini{opacity:1}
/* 右下角的字換成圖示：首頁是課本（課程輪盤）、學期頁是疊起來的學期、子頁面一律是返回箭頭 */
#mini svg,#home svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 設定、個人頁打開時輪盤收起來，右下角換成一顆同樣大小、同樣玻璃的返回鈕，位置跟平常一樣 */
#mini .rays{stroke-width:1.3}
#home{position:absolute;right:0;bottom:0;width:calc(var(--dz)*.25);height:calc(var(--dz)*.25);box-sizing:border-box;border:0;margin:0;padding:0 max(10px,env(safe-area-inset-right,0px)) 10px 0;display:flex;align-items:flex-end;justify-content:flex-end;border-top-left-radius:100%;color:var(--fg);cursor:pointer;pointer-events:auto}
#home[hidden]{display:none}
#home:active{opacity:.6}
/* 子頁面可以從左邊緣往右滑返回上一層：直向還是正常捲動 */
#sheet,#forum,#drawer{touch-action:pan-y}

/* 左下圓形鈕「我」：點開是全螢幕個人頁；底部兩個角避開 iPhone 的 Home 橫條 */
/* 左下三顆鈕同一條底線、一樣大、等距：六角形「設定」最左，方形「討論」中間，圓形「我」最右 */
#stage{--me:40px;--meGap:14px;--meH:max(16px,env(safe-area-inset-left,0px));--meR:calc(var(--meH) + var(--me) + var(--meGap));--meL:calc(var(--meR) + var(--me) + var(--meGap));--meB:8px}
#tab{position:absolute;left:var(--meL);bottom:var(--meB);width:var(--me);height:var(--me);padding:0;pointer-events:auto;border:1px solid var(--line);background:var(--core);border-radius:50%;font-size:14px;font-weight:600;cursor:pointer;color:var(--fg);box-shadow:0 2px 8px var(--glsh)}
#tab.under,#hex.under,#dial.under,#glass.under,#dial.under~#mini{visibility:hidden}
#veil{position:absolute;inset:0;background:var(--veil);pointer-events:auto}
/* 個人頁、設定頁：和課程頁一樣蓋滿，從按下的那顆鈕的位置長出來（--ox 是那顆鈕的中心） */
#drawer{position:absolute;inset:0;background:var(--bg);pointer-events:auto;box-sizing:border-box;padding-top:14px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;--lead:22px;--ox:38px;
  clip-path:circle(0 at var(--ox) calc(100% - 28px));transition:clip-path .34s cubic-bezier(.3,.8,.25,1)}
#drawer.on{clip-path:circle(150% at var(--ox) calc(100% - 28px))}
#drawer:not(.on){visibility:hidden;transition:clip-path .26s cubic-bezier(.4,0,.2,1),visibility 0s .26s}
#drawer>.top{min-height:44px;margin-bottom:12px}
#dbody{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding-bottom:24px}
#dbody::-webkit-scrollbar{display:none}
/* 身分做成一張明信片：左邊借書證 QR，右邊頭貼當郵票、名字系級學號寫在地址線上；不放教學文字，外框呼吸燈讓人想點 */
/* 點明信片翻面，背面是放大的 QR 給館員掃；翻過 3 次就不再呼吸 */
.pc{position:relative;width:100%;aspect-ratio:3/2;max-height:260px;perspective:1200px;cursor:pointer;border-radius:12px;outline-offset:4px}
.pc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.25,1)}
.pc.flip .pc-in{transform:rotateY(180deg)}
.pc-f,.pc-b{position:absolute;inset:0;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--disc);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.pc-f{display:grid;grid-template-columns:1fr 1px 1.15fr;gap:14px;padding:14px}
.pc-b{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;background:#fff}
.pc:not(.calm):not(.flip) .pc-f{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 transparent;border-color:var(--line)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 10%,transparent),0 0 22px color-mix(in srgb,var(--fg) 16%,transparent);border-color:color-mix(in srgb,var(--fg) 40%,transparent)}}
.pc-l{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.pc-sep{background:var(--line)}
.pc-r{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
/* QR 不管亮暗都是白底黑點，掃描器才讀得到 */
.qr{width:min(100%,104px);aspect-ratio:1;padding:5px;background:#fff;border-radius:6px;box-sizing:border-box}
.qr svg{display:block;width:100%;height:100%}
.pc-b .qr{width:auto;height:86%;padding:0}
/* 郵票：鋸齒邊用遮罩打洞，裡面是頭貼；點郵票換頭貼 */
.stamp{position:absolute;top:0;right:0;width:62px;height:74px;padding:4px;box-sizing:border-box;border:0;background:#fff;cursor:pointer;
  -webkit-mask:radial-gradient(3px at 3px 3px,#0000 97%,#000) -3px -3px/6px 6px round,linear-gradient(#000 0 0) content-box;mask:radial-gradient(3px at 3px 3px,#0000 97%,#000) -3px -3px/6px 6px round,linear-gradient(#000 0 0) content-box;-webkit-mask-composite:source-over;mask-composite:add}
.stamp img,.stamp svg{display:block;width:100%;height:100%;object-fit:cover}
/* 郵戳：壓在郵票左下角 */
.pmark{position:absolute;z-index:1;top:40px;right:50px;width:50px;height:50px;border:1.5px solid var(--mute);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:9px/1.25 var(--mono);color:var(--mute);transform:rotate(-14deg);opacity:.75;pointer-events:none}
.addr{display:grid;gap:6px}
.addr div{border-bottom:1px solid var(--line);padding-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .nm{font-size:19px;font-weight:600}
.addr .dp{font-size:12px}
/* 換頭貼：明信片下面一排兩個選項 */
.avm{display:flex;gap:6px;margin-top:10px}
.avm button,.avm label{border:1px solid var(--line);background:none;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--fg)}
.avm .on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* 左下圓鈕也用同一張頭貼 */
#tab img,#tab svg{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
#tab:has(img,svg){overflow:hidden}
@media (prefers-reduced-motion:reduce){.pc-in{transition:none}.pc .pc-f{animation:none!important}}
.me-sec{margin-top:36px}
.me-sec>.lbl{padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--fg);font-weight:600}
/* 系統入口：兩欄，每格是一個外連 */
.sys{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sys a{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);text-decoration:none;background:var(--disc)}
.sys a b{display:block;font-size:14px;font-weight:600}
.sys a .s{margin-top:2px}
/* 其他項目一行一個，點了在原地展開 */
.me-row{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;font-size:14px;color:var(--fg);text-decoration:none;text-align:left}
.me-row .mono{margin-left:auto;padding-left:12px}
.me-row[aria-expanded="true"]{border-bottom-color:transparent;font-weight:600}
.me-more{padding:4px 0 14px;border-bottom:1px solid var(--line)}
.me-more .val{margin-top:0}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:16px;padding:2px}
.seg3 button{border:0;background:none;border-radius:14px;padding:5px 14px;font-size:13px;cursor:pointer}
.seg3 button.on{background:var(--fg);color:var(--bg)}
/* 左下方形「課程討論」，在「我」右邊；打開後蓋住四頁，右下輪盤換成四類（我的、本系、通識、其他） */
#sq{position:absolute;left:var(--meR);bottom:var(--meB);width:var(--me);height:var(--me);padding:0;pointer-events:auto;border:1px solid var(--line);background:var(--core);border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;color:var(--fg)}
#sq.under{visibility:hidden}
/* 左下六角形「設定」：用 SVG 畫六角形，和另外兩顆同色、同描邊 */
#hex{position:absolute;left:var(--meH);bottom:var(--meB);width:var(--me);height:var(--me);padding:0;pointer-events:auto;border:0;background:none;cursor:pointer;filter:drop-shadow(0 2px 4px var(--glsh))}
#hex svg{display:block;width:100%;height:100%}
/* 左下三顆鈕兩種樣式（設定「左下按鈕」切換）：a＝三顆各自一塊液態玻璃，中間細線符號；d＝三個細線符號收進同一條玻璃膠囊 */
:root{--lgf:rgba(255,255,255,.35);--lgr:rgba(255,255,255,.9);--lgh:#fff;--lgl:rgba(255,255,255,.6);--dkf:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lgf:rgba(255,255,255,.06);--lgr:rgba(255,255,255,.35);--lgh:rgba(255,255,255,.55);--lgl:rgba(255,255,255,.18);--dkf:rgba(40,40,46,.55)}}
:root[data-theme="dark"]{--lgf:rgba(255,255,255,.06);--lgr:rgba(255,255,255,.35);--lgh:rgba(255,255,255,.55);--lgl:rgba(255,255,255,.18);--dkf:rgba(40,40,46,.55)}
#hex,#tab,#sq{transition:transform .12s}
#hex:active,#tab:active,#sq:active{transform:scale(.94)}
#tab::before,#sq::before{content:"";position:absolute;left:50%;top:50%;box-sizing:border-box;border:1.6px solid var(--fg);opacity:.85;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px}
#tab::before{border-radius:50%}
#sq::before{border-radius:3px}
#tab:has(img,svg)::before{display:none}
/* 六角形的玻璃放在裁好的內層（同一層又裁又模糊，有些瀏覽器會變方的），亮邊用 SVG 描 */
#hex .gl{position:absolute;inset:0;clip-path:polygon(50% 2%,93% 26%,93% 74%,50% 98%,7% 74%,7% 26%)}
#hex svg{position:relative}
#hex .rim{fill:none;stroke:var(--lgr);stroke-width:1}
#hex .hole,#hex .nut{fill:none;stroke:var(--fg);stroke-opacity:.85;stroke-width:1.6;stroke-linejoin:round}
#hex .nut{display:none}
/* a 液態玻璃：透明、透出後面內容、邊緣一圈亮光 */
:root:not([data-btn="d"]) #tab,:root:not([data-btn="d"]) #sq,:root:not([data-btn="d"]) #hex .gl{background:var(--lgf);-webkit-backdrop-filter:blur(6px) saturate(180%);backdrop-filter:blur(6px) saturate(180%)}
:root:not([data-btn="d"]) #tab,:root:not([data-btn="d"]) #sq{border:0;box-shadow:inset 0 0 0 .5px var(--lgr),inset 1px 1.5px 0 -.5px var(--lgh),inset -1px -1.5px 0 -.5px var(--lgl),0 6px 16px var(--glsh)}
:root:not([data-btn="d"]) #sq{border-radius:11px}
:root:not([data-btn="d"]) #hex{filter:drop-shadow(0 5px 8px var(--glsh))}
/* d 膠囊：一條玻璃膠囊墊在三顆底下，鈕本身透明，只剩符號 */
#dock{display:none;position:absolute;left:calc(var(--meH) - 4px);bottom:calc(var(--meB) - 4px);width:calc(var(--me)*3 + var(--meGap)*2 + 8px);height:calc(var(--me) + 8px);border-radius:999px;pointer-events:none;background:var(--dkf);-webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--lgr),inset 0 1px 0 var(--lgh),0 8px 20px var(--glsh)}
:root[data-btn="d"] #dock{display:block}
#stage:has(#tab[hidden]) #dock,#stage:has(#tab.under) #dock{visibility:hidden}
:root[data-btn="d"] #tab,:root[data-btn="d"] #sq{border:0;background:none;box-shadow:none}
:root[data-btn="d"] #tab::before{width:16px;height:16px;margin:-8px 0 0 -8px}
:root[data-btn="d"] #sq::before{width:15px;height:15px;margin:-7.5px 0 0 -7.5px}
:root[data-btn="d"] #hex{filter:none}
:root[data-btn="d"] #hex .gl,:root[data-btn="d"] #hex .rim{display:none}
:root[data-btn="d"] #hex .nut{display:inline}
:root[data-btn="d"] #hex .hole{r:2.8px}
/* 設定頁：每一項直接攤開，不用再點開 */
.set-sec+.set-sec{margin-top:28px}
#forum{position:absolute;inset:0;background:var(--bg);pointer-events:auto;display:flex;flex-direction:column;box-sizing:border-box;padding-top:14px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 右下輪盤平常縮成一半停在角落，清單底下留出它的高度才捲得到最後一列 */
#fbody{flex:1;min-height:0;overflow:auto;padding-bottom:calc(var(--dz)*.5 + 8px)}

for(const n in RATE)RATE[n]={普通:'普',雷:'拉'}[RATE[n]]||RATE[n];
/* ---------- 資料 ---------- */

let DATA=null;try{DATA=JSON.parse(store.get('campus-data')||'null')}catch(e){}
if(!DATA||DATA.format!=='campus-data')DATA=JSON.parse($('seed').textContent);

// 處理書籤 / iOS 捷徑回傳的資料匯入
if(location.hash.startsWith('#import=')){
  try{
    const raw=decodeURIComponent(location.hash.slice(8));
    const inc=JSON.parse(raw);
    if(inc.source==='elearning'){
      if(inc.events&&inc.events.length){
        const schEvents=(DATA.events||[]).filter(e=>e.kind==='school');
        DATA.events=[...inc.events,...schEvents];
      }
      if(inc.courses&&DATA.courses){
        inc.courses.forEach(c=>{
          const m=DATA.courses.find(x=>x.title===c.title||x.id===c.id);
          if(m)m.elearning=Object.assign(m.elearning||{},c.elearning||{});
        });
      }
      DATA.exportedAt=inc.exportedAt;
    }else if(inc.source==='webap'){
      if(inc.courses&&inc.courses.length){
        inc.courses.forEach(c=>{
          const m=(DATA.courses||[]).find(x=>x.title===c.title);
          if(m&&m.elearning)c.elearning=m.elearning;
        });
        DATA.courses=inc.courses;
      }
      DATA.exportedAt=inc.exportedAt;
    }else{
      DATA=Object.assign(DATA,inc);
    }
    store.set('campus-data',JSON.stringify(DATA));
    history.replaceState(null,'',location.pathname+location.search);
  }catch(err){console.error('匯入解析失敗',err)}
}
// 日期換成「11 月幾號」：10 月是 0 以下、12 月是 31 以上
const D0=new Date(2026,10,1),dayOf=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round((new Date(y,m-1,d)-D0)/864e5)+1};
const mins=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const CA=DATA.creditAudit||{};
const CAT=(CA.categories||[]).map(c=>[c.category,c.required]),NEED=CA.required||0;
const PER=Object.fromEntries((DATA.periods||[]).map(p=>[p.id,[mins(p.start),mins(p.end)]]));
const ORDER=(DATA.periods||[]).map(p=>p.id);
const SEMS=[...(DATA.semesters||[])].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})),CUR=SEMS.find(s=>s.current)||SEMS[SEMS.length-1]||{id:''};
// 一個上課時段的節次可能不連續，拆成連續的幾段
const runs=m=>{const ks=[...new Set(m.periods)].map(p=>ORDER.indexOf(p)).filter(k=>k>=0).sort((a,b)=>a-b),out=[];
  for(const k of ks){const l=out[out.length-1];if(l&&l[2]===k-1)l[2]=k;else out.push([m.weekday-1,k,k])}return out.map(([d,a,b])=>[d,ORDER[a],ORDER[b]])};
// tc 是老師；評價是自己給的（神、普通、雷），存在手機裡
// 課程是唯一的「東西」，今天、本週、學期、輪盤都從這裡取。k 是兩字簡稱；cat 和學期圓環同一套分類；t 是 [星期, 第幾節起, 第幾節止]
const COURSES=(DATA.courses||[]).filter(c=>c.semester===CUR.id).map(c=>{const m=c.meetings||[],e=c.elearning||{};
  return{n:c.title,k:c.short||c.title.slice(0,2),tc:(c.instructors||[]).join('、'),cat:c.category||'其他',cr:c.credits||0,mat:e.materials||0,r:(m[0]&&m[0].room)||'',t:m.flatMap(runs),...(e.unreadAnnouncements?{ann:e.unreadAnnouncements}:{})}});
const SHORT=n=>(COURSES.find(c=>c.n===n)||{}).k||n.slice(0,2);
const sess=d=>COURSES.flatMap(c=>c.t.filter(x=>x[0]===d).flatMap(([,a,b])=>ORDER.slice(ORDER.indexOf(a),ORDER.indexOf(b)+1).map(p=>[c.n,c.r,p]))).sort((x,y)=>ORDER.indexOf(x[2])-ORDER.indexOf(y[2]));
// 同課程、同教室、節次相鄰就合併
function merge(list){const out=[];for(const[n,r,p]of list){const k=ORDER.indexOf(p),l=out[out.length-1];if(l&&l.n===n&&l.r===r&&l.last===k-1){l.last=k;l.end=PER[p][1];l.c++}else out.push({n,r,first:k,last:k,start:PER[p][0],end:PER[p][1],c:1})}return out}
const inC=(c,p)=>c.first<=ORDER.indexOf(p)&&ORDER.indexOf(p)<=c.last;
// 每天從第 1 節畫到第 8 節（含 A），有 M 節或晚上的課才往前、往後加；沒有夜間課就不畫晚上
const span=ps=>{const ks=ps.map(p=>ORDER.indexOf(p));return ORDER.slice(Math.min(1,...ks),Math.max(ORDER.indexOf('8'),...ks)+1)};
const yi=(i,n)=>(i+.5)/n*100;
// 今天頁一節佔的高度（px）
const STEP=28;
// 截止時刻落在哪一節；比最後一節還晚就回傳 -1，放到「今晚」
const slot=(P,m)=>P.findIndex(p=>m<=PER[p][1]);
// 現在落在哪一節；下課時間放在前後兩節中間
function nowAt(P){const n=P.length,i=P.findIndex(p=>PER[p][0]<=now&&now<PER[p][1]);if(i>=0)return{i,y:yi(i,n)};
  const j=P.findIndex(p=>PER[p][0]>now);return{y:j<0?100:j===0?0:(yi(j-1,n)+yi(j,n))/2}}

/* ---------- 有日期的事 ---------- */
// 今天、本週、本月、課程頁都讀同一份。day 是 11 月幾號，m 時刻（分鐘，沒有就是整天），k：hw 作業、ex 考試、sch 學校行事曆、me 自己新增
const TD=2,WK0=2,TODAY=TD-WK0,WD=['一','二','三','四','五','六','日'];
const KIND={assignment:'hw',exam:'ex',school:'sch'},CTITLE=Object.fromEntries((DATA.courses||[]).map(c=>[c.id,c.title]));

 ...((DATA.mine||{}).todos||[]).map(t=>{const x={day:dayOf(t.date||'2026-11-02'),n:t.title,k:'me'};if(t.time)x.m=mins(t.time);return x})];
EV.forEach((x,i)=>{x.id='e'+i;x.d=x.day-WK0});
let now=880;

  C.forEach(c=>{if((c.c>1||c===cur)&&c.end>now)h+=`<i class="link" style="top:${y(ORDER[c.first])}%;height:${y(ORDER[c.last])-y(ORDER[c.first])}%"></i>`});
  if(P.includes('A'))h+=`<i class="noon" style="top:${y('A')}%"></i>`;
  P.forEach((p,i)=>{const c=C.find(c=>inC(c,p));if(p==='A'&&!c&&nw.i!==i)return;if(c&&c===cur)return;h+=`<i class="dot${c?'':' e'}${c&&PER[p][1]<=now?' done':''}" style="top:${yi(i,n)}%"></i>`});

  D.filter(x=>x.k==='ex'&&slot(P,x.m)>=0).forEach(x=>{const p=P[slot(P,x.m)];h+=dueIc(x,C.some(c=>inC(c,p)),y(p))});

// 日頁的直條、格子、橫條：一門課一塊，和週頁同一套（考試整塊反白、正在上的橘色、上完的字變淡、作業圈在那門課那塊的右下角）

// 標籤盡量對齊自己的時段中間；擠不下就往下推，再從底部往上收

// 試玩用：拖曳一節一節跳，拖到最上面是上課前，最下面是晚上

/* ---------- 本週 ---------- */

let wSel=null;

  const P=span(days.flatMap(d=>sess(d).map(x=>x[2])));
  const D=days.map(d=>{const on=d===TODAY,gone=e=>d<TODAY||(on&&e<=now);
    const B=merge(sess(d)).map(c=>({...c,k:SHORT(c.n),a:P.indexOf(ORDER[c.first]),b:P.indexOf(ORDER[c.last]),st:on&&c.start<=now&&now<c.end?'cur':gone(c.end)?'done':'',ex:null}));
    // 考試蓋住那門課當天的整塊；作業圈只畫在那門課當天那塊裡，當天沒上那門課就只列在下面清單
    U.filter(x=>x.d===d).forEach(x=>{const i=slot(P,x.m),bl=x.k==='ex'&&(B.find(c=>c.n===x.c&&i>=c.a&&i<=c.b)||B.find(c=>c.n===x.c));const own=x.k==='hw'&&B.find(c=>c.n===x.c);if(bl)bl.ex=x;else if(own)(own.hw=own.hw||[]).push(x)});

  $('fback').hidden=!back;$('fcrumb').hidden=!!back;if(back){$('fback').textContent=back[0];$('fback').dataset.to=back[1]}

// 從螢幕左邊緣往右滑＝返回（跟 iPhone 一樣）：頁面跟著手指走，拉過三分之一或甩得夠快就退一層，不然彈回去
let es=null;
document.addEventListener('pointerdown',e=>{const el=topPage();if(el&&e.clientX<28)es={x:e.clientX,y:e.clientY,t:performance.now(),el,go:false}},true);
document.addEventListener('pointermove',e=>{if(!es)return;const dx=e.clientX-es.x,dy=e.clientY-es.y;
  if(!es.go){if(Math.abs(dy)>12&&Math.abs(dy)>dx){es=null;return}if(dx<10)return;es.go=true;es.el.style.transition='none'}
  es.el.style.transform=`translateX(${Math.max(0,dx)}px)`;es.el.style.boxShadow='-8px 0 24px var(--glsh)'},true);
const esEnd=e=>{if(!es)return;const{el,go,x,t}=es;es=null;if(!go)return;
  // 滑過的手指放開時不要順便點到左邊緣的按鈕
  const eat=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',eat,true);setTimeout(()=>document.removeEventListener('click',eat,true),0);
  const dx=Math.max(0,(e.clientX??x)-x),v=dx/(performance.now()-t),W=el.offsetWidth,done=e.type==='pointerup'&&(dx>W/3||v>.6&&dx>40);
  const a=el.animate([{transform:`translateX(${dx}px)`},{transform:`translateX(${done?W:0}px)`}],{duration:RM.matches?0:done?180:220,easing:done?'cubic-bezier(.3,.6,.4,1)':'cubic-bezier(.2,1.2,.4,1)'});
  el.style.transform=`translateX(${done?W:0}px)`;
  a.onfinish=()=>{if(done)backOne(el);requestAnimationFrame(()=>{el.style.transform='';el.style.boxShadow='';requestAnimationFrame(()=>el.style.transition='')})}};

// 折射只給 Chrome 系：iOS 上的瀏覽器都是 WebKit，backdrop-filter 不吃 SVG 濾鏡，留著只有鼓起感
function drawLens(){const g=$('glass'),w=g.offsetWidth;if(!w)return;const S=Math.min(256,w),c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d'),im=x.createImageData(S,S),band=.22;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const dx=(S-i)/S,dy=(S-j)/S,d=Math.hypot(dx,dy),k=(i+j*S)*4;let vx=0,vy=0;
    if(d<1&&d>1-band){const f=((d-(1-band))/band)**2.2;vx=dx/d*f;vy=dy/d*f}
    im.data[k]=128+vx*127;im.data[k+1]=128+vy*127;im.data[k+2]=128;im.data[k+3]=255}
  x.putImageData(im,0,0);const fe=$('lensMap');fe.setAttribute('href',c.toDataURL());fe.setAttribute('width',w);fe.setAttribute('height',w);
  g.classList.remove('lens');requestAnimationFrame(()=>g.classList.add('lens'))}
if(/Chrome|Chromium|Edg\//.test(navigator.userAgent)&&!/iPhone|iPad|iPod|CriOS|EdgiOS/.test(navigator.userAgent)){drawLens();addEventListener('resize',()=>requestAnimationFrame(drawLens))}
